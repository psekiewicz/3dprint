# nginx: subdomena z zamówieniami druku 3D -> kontener na 127.0.0.1:3000
#
# 1. Dodaj w DNS rekord A dla subdomeny (np. druk.pixelinventor.com) na adres serwera.
# 2. Skopiuj ten plik do /etc/nginx/sites-available/druk3d i podlinkuj:
#      sudo ln -s /etc/nginx/sites-available/druk3d /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# 3. Włącz HTTPS (certbot sam dopisze certyfikat i przekierowanie z http):
#      sudo certbot --nginx -d druk.pixelinventor.com

server {
    listen 80;
    listen [::]:80;
    server_name druk.pixelinventor.com;

    # nginx domyślnie przyjmuje do 1 MB — za mało na modele 3D.
    # Ustaw nie mniej niż „Maksymalny rozmiar pliku" w panelu sprzedawcy.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # plik trafia od razu do aplikacji
        proxy_read_timeout 300s;
    }
}
