<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zamówienia druku 3D</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="inner">
      <h1>Zamówienia druku 3D</h1>
      <span class="who" id="who"></span>
      <button class="small" id="logout" hidden>Zmień osobę</button>
    </div>
  </header>

  <div class="demo-banner" id="demo-banner" hidden>Wersja pokazowa — dane zapisują się tylko w tej przeglądarce i nikt inny ich nie zobaczy.</div>

  <main id="login" hidden>
    <form class="card narrow" id="login-form">
      <h2>Kto zamawia?</h2>
      <label for="login-name">Imię i nazwisko</label>
      <input type="text" id="login-name" maxlength="60" autocomplete="name" required>
      <label for="login-code">Kod klasy</label>
      <input type="text" id="login-code" maxlength="40" autocomplete="off" autocapitalize="none" required>
      <p class="hint">Kod klasy poda nauczyciel. Kod <strong>demo</strong> otwiera wersję pokazową.</p>
      <div class="message error" id="login-error"></div>
      <div class="actions"><button class="primary">Dalej</button></div>
    </form>
  </main>

  <main id="app" hidden>
    <form class="card" id="order-form">
      <h2>Nowe zamówienie</h2>
      <div class="grid2">
        <div>
          <label for="file">Model (STL lub 3MF)</label>
          <div class="drop" id="drop" tabindex="0" role="button">
            <strong>Wybierz plik</strong> albo przeciągnij go tutaj
            <div id="file-info"></div>
          </div>
          <input type="file" id="file" accept=".stl,.3mf" hidden>

          <label for="title">Nazwa wydruku</label>
          <input type="text" id="title" maxlength="80" placeholder="np. Uchwyt na telefon" required>

          <label>Drukarka</label>
          <div class="choices" id="printers"></div>

          <label>Filament</label>
          <div class="choices" id="filaments"></div>

          <label for="quantity">Liczba sztuk</label>
          <input type="number" id="quantity" min="1" max="10" value="1" required style="max-width:120px">

          <label for="notes">Uwagi dla nauczyciela (opcjonalnie)</label>
          <textarea id="notes" maxlength="500" placeholder="np. do projektu z fizyki, potrzebne na piątek"></textarea>
        </div>
        <div>
          <label>Podgląd</label>
          <div id="preview">Tu pojawi się podgląd modelu</div>
          <ul class="fit" id="fit"></ul>
        </div>
      </div>
      <div class="message error" id="order-error"></div>
      <div class="message success" id="order-success"></div>
      <div class="actions">
        <button class="primary" id="submit">Złóż zamówienie</button>
        <span class="hint" id="limit-info"></span>
      </div>
    </form>

    <section class="card">
      <h2>Kolejka</h2>
      <div class="tabs" id="tabs"></div>
      <div class="orders" id="orders"></div>
    </section>
  </main>
</body>
</html>
