<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Druk 3D — panel nauczyciela</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script type="module" src="admin.js"></script>
</head>
<body>
  <header class="top">
    <div class="inner">
      <h1>Druk 3D — panel nauczyciela</h1>
      <button class="small" id="logout" hidden>Wyloguj</button>
    </div>
  </header>

  <main id="login" hidden>
    <form class="card narrow" id="login-form">
      <h2>Logowanie</h2>
      <label for="password">Hasło nauczyciela</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <div class="message error" id="login-error"></div>
      <div class="actions"><button class="primary">Zaloguj</button></div>
    </form>
  </main>

  <main id="app" hidden>
    <section class="card">
      <h2>Zamówienia</h2>
      <div class="tabs" id="tabs"></div>
      <div class="orders" id="orders"></div>
    </section>

    <form class="card" id="settings-form">
      <h2>Ustawienia</h2>
      <div class="grid2">
        <div>
          <label for="class-code">Kod klasy</label>
          <input type="text" id="class-code" maxlength="40" required>
          <p class="hint">Uczniowie wpisują go przy pierwszym wejściu. Wielkość liter nie ma znaczenia.</p>

          <label for="max-active">Limit aktywnych zamówień na ucznia</label>
          <input type="number" id="max-active" min="1" max="50" required>

          <label for="max-file">Maksymalny rozmiar pliku (MB)</label>
          <input type="number" id="max-file" min="1" max="200" required>

          <label>Dostępne drukarki</label>
          <div id="printers"></div>

          <label for="new-password">Nowe hasło nauczyciela</label>
          <input type="password" id="new-password" autocomplete="new-password" placeholder="zostaw puste, aby nie zmieniać">
        </div>
        <div>
          <label>Filamenty</label>
          <div id="filaments"></div>
          <button type="button" class="small" id="add-filament">+ Dodaj filament</button>
        </div>
      </div>
      <div class="message error" id="settings-error"></div>
      <div class="message success" id="settings-success"></div>
      <div class="actions"><button class="primary">Zapisz ustawienia</button></div>
    </form>
  </main>
</body>
</html>
